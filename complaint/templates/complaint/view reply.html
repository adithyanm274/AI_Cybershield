<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CyberShield | View Replies</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f7fc 0%, #e8f0f7 100%);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            border-bottom: 1px solid #e2edf2;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
        }

        .logo i {
            color: #1e6f5c;
            font-size: 1.8rem;
        }

        .logo span {
            background: linear-gradient(135deg, #0a2b4e, #1e6f5c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .home-link {
            background: #0a2b4e10;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: #1a2c3e;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .home-link:hover {
            background: #0a2b4e20;
        }

        /* Main container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Header Section */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
        }

        .page-header h2 {
            font-size: 1.8rem;
            color: #0a2b4e;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .page-header h2 i {
            color: #1e6f5c;
        }

        /* Stats Badge */
        .stats-badge {
            background: white;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a2c3e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #e9f0f5;
        }

        .stats-badge i {
            color: #1e6f5c;
        }

        /* Search Bar */
        .search-bar {
            margin-bottom: 28px;
        }

        .search-input {
            max-width: 350px;
            display: flex;
            align-items: center;
            background: white;
            border-radius: 60px;
            padding: 10px 20px;
            border: 1px solid #e2edf2;
            transition: 0.2s;
        }

        .search-input i {
            color: #8ba3b5;
            margin-right: 10px;
        }

        .search-input input {
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .search-input:focus-within {
            border-color: #1e6f5c;
            box-shadow: 0 0 0 3px rgba(30, 111, 92, 0.1);
        }

        /* Replies Grid */
        .replies-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Reply Card */
        .reply-card {
            background: white;
            border-radius: 28px;
            padding: 24px 28px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #e9f0f5;
        }

        .reply-card:hover {
            transform: translateX(4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-color: #cbdde9;
        }

        /* Complaint Section */
        .complaint-section {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f4f9;
        }

        .complaint-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #c53030;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .complaint-label i {
            font-size: 0.8rem;
        }

        .complaint-text {
            color: #2c3e50;
            font-size: 0.95rem;
            line-height: 1.5;
            background: #fff5f5;
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 3px solid #c53030;
        }

        /* Reply Section */
        .reply-section {
            margin-top: 8px;
        }

        .reply-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1e6f5c;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .reply-label i {
            font-size: 0.8rem;
        }

        .reply-text {
            color: #2c4e6e;
            font-size: 0.95rem;
            line-height: 1.5;
            background: #e0f0ea;
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 3px solid #1e6f5c;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 48px;
            color: #8ba3b5;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 0 20px;
            border-top: 1px solid #e2edf2;
            margin-top: 48px;
            color: #5b7a95;
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-container {
                padding: 0 20px;
            }
            .container {
                padding: 24px 16px;
            }
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .page-header h2 {
                font-size: 1.4rem;
            }
            .reply-card {
                padding: 18px 20px;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="nav-container">
        <a href="/" class="logo">
            <i class="fas fa-shield-halos"></i>
            <span>AI CyberShield</span>
        </a>
        <div>
            <a href="/temp/user/" class="home-link">
                <i class="fas fa-home"></i> Home
            </a>
        </div>
    </div>
</div>

<div class="container">
    <!-- Header -->
    <div class="page-header">
        <h2>
            <i class="fas fa-reply-all"></i>
            View Replies
        </h2>

    </div>

    <!-- Search Bar -->


    <!-- Replies Grid -->
    <div class="replies-grid" id="repliesGrid">
        {% for i in ok %}
        <div class="reply-card" data-complaint="{{ i.complaint|lower }}" data-reply="{{ i.reply|lower }}">
            <div class="complaint-section">
                <div class="complaint-label">
                    <i class="fas fa-exclamation-triangle"></i>
                    Complaint
                </div>
                <div class="complaint-text">
                    <i class="fas fa-quote-left" style="color: #c53030; opacity: 0.5; margin-right: 6px;"></i>
                    {{ i.complaint }}
                </div>
            </div>
            <div class="reply-section">
                <div class="reply-label">
                    <i class="fas fa-reply"></i>
                    Reply
                </div>
                <div class="reply-text">
                    <i class="fas fa-comment-dots" style="margin-right: 8px;"></i>
                    {{ i.reply }}
                </div>
            </div>
        </div>
        {% empty %}
        <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <p>No replies yet</p>
            <p style="font-size: 0.8rem; margin-top: 8px;">Replies to complaints will appear here</p>
        </div>
        {% endfor %}
    </div>
</div>

<footer>
    <p><i class="fas fa-shield-alt"></i> © 2025 AI CyberShield — Support Response System</p>
</footer>



</body>
</html>
