<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CyberShield | Post Reply</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f7fc 0%, #e8f0f7 100%);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            border-bottom: 1px solid #e2edf2;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
        }

        .logo i {
            color: #1e6f5c;
            font-size: 1.8rem;
        }

        .logo span {
            background: linear-gradient(135deg, #0a2b4e, #1e6f5c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .home-link {
            background: #0a2b4e10;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: #1a2c3e;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .home-link:hover {
            background: #0a2b4e20;
        }

        /* Main container */
        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Reply Card */
        .reply-card {
            background: white;
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Card Header */
        .card-header {
            background: linear-gradient(135deg, #0a2b4e 0%, #1a4a6f 100%);
            padding: 32px 32px 28px;
            text-align: center;
        }

        .header-icon {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .header-icon i {
            font-size: 2.2rem;
            color: white;
        }

        .card-header h2 {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-header p {
            color: rgba(255,255,255,0.75);
            font-size: 0.9rem;
        }

        /* Card Body */
        .card-body {
            padding: 36px 40px 44px;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 28px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1a2c3e;
            margin-bottom: 12px;
        }

        .form-label i {
            color: #1e6f5c;
            font-size: 1rem;
        }

        /* Textarea */
        .reply-textarea {
            width: 100%;
            padding: 18px 20px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            border: 2px solid #e2edf2;
            border-radius: 28px;
            transition: all 0.2s ease;
            background: #fefefe;
            resize: vertical;
            line-height: 1.6;
        }

        .reply-textarea:focus {
            outline: none;
            border-color: #1e6f5c;
            box-shadow: 0 0 0 3px rgba(30, 111, 92, 0.1);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background: #1e6f5c;
            color: white;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #0a5b4a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 111, 92, 0.3);
        }

        /* Alert messages */
        .alert {
            padding: 14px 20px;
            border-radius: 60px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        .alert-success {
            background: #e0f0ea;
            color: #1e6f5c;
        }

        .alert-error {
            background: #fee2e2;
            color: #c53030;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 0 20px;
            border-top: 1px solid #e2edf2;
            margin-top: 48px;
            color: #5b7a95;
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .nav-container {
                padding: 0 20px;
            }
            .container {
                padding: 24px 16px;
            }
            .card-body {
                padding: 28px 24px 36px;
            }
            .card-header h2 {
                font-size: 1.5rem;
            }
            .header-icon {
                width: 55px;
                height: 55px;
            }
            .header-icon i {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <i class="fas fa-shield-halos"></i>
                <span>AI CyberShield</span>
            </a>
            <div>
                <a href="/temp/admin/" class="home-link">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="reply-card">
            <!-- Card Header -->
            <div class="card-header">
                <div class="header-icon">
                    <i class="fas fa-reply-all"></i>
                </div>
                <h2>Post Reply</h2>
                <p>Respond to user complaints</p>
            </div>

            <!-- Card Body -->
            <div class="card-body">
                <!-- Django messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                            <i class="fas fa-{% if message.tags == 'success' %}check-circle{% else %}exclamation-circle{% endif %}"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="form-group">
                        <div class="form-label">
                            <i class="fas fa-comment-dots"></i>
                            <span>Reply</span>
                        </div>
                        <textarea
                                maxlength="500"
                            name="reply"
                            class="reply-textarea"
                            rows="5"
                            required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fas fa-paper-plane"></i>
                        Send Reply
                    </button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p><i class="fas fa-shield-alt"></i> © 2025 AI CyberShield — Customer Support</p>
    </footer>
</body>
</html>
