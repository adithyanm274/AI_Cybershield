<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CyberShield | Add Credential Data</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#f0f7fc 0%,#e8f0f7 100%);
    min-height:100vh;
}

/* Navbar */

.navbar{
    background:white;
    box-shadow:0 2px 12px rgba(0,0,0,0.05);
    border-bottom:1px solid #e2edf2;
}

.nav-container{
    max-width:1400px;
    margin:auto;
    padding:0 30px;
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:1.4rem;
    font-weight:800;
}

.logo i{
    color:#1e6f5c;
}

.logo span{
    background:linear-gradient(135deg,#0a2b4e,#1e6f5c);
    -webkit-background-clip:text;
    color:transparent;
}

.home-link{
    text-decoration:none;
    color:#1a2c3e;
    background:#eef4f8;
    padding:10px 18px;
    border-radius:30px;
    font-weight:600;
}

/* Main */

.container{
    max-width:700px;
    margin:50px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,0.08);
}

.card-header{
    background:linear-gradient(135deg,#0a2b4e,#1a4a6f);
    color:white;
    text-align:center;
    padding:35px;
}

.card-header i{
    font-size:3rem;
    margin-bottom:15px;
}

.card-header h2{
    margin-bottom:10px;
}

.card-body{
    padding:35px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#0a2b4e;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #e2edf2;
    border-radius:15px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#1e6f5c;
}

.btn{
    width:100%;
    padding:15px;
    background:#1e6f5c;
    color:white;
    border:none;
    border-radius:30px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#145144;
}

.success{
    background:#e6ffed;
    color:#146c43;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
    text-align:center;
}

</style>
</head>
<body>

<div class="navbar">
    <div class="nav-container">
        <a href="#" class="logo">
            <i class="fas fa-shield-alt"></i>
            <span>AI CyberShield</span>
        </a>

        <a href="/temp/admin/" class="home-link">
            <i class="fas fa-home"></i> Home
        </a>
    </div>
</div>

<div class="container">

    <div class="card">

        <div class="card-header">
            <i class="fas fa-database"></i>
            <h2>Add Credential Breach Data</h2>
            <p>Manage leaked credential records for security monitoring</p>
        </div>

        <div class="card-body">

            {% if msg %}
            <div class="success">
                {{ msg }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email"
                           name="email"
                           placeholder="Enter leaked email"
                           required>
                </div>

                <div class="form-group">
                    <label>Breach Source</label>
                    <input type="text"
                           name="breach_source"
                           placeholder="Example: LinkedIn Data Breach"
                           required>
                </div>

                <div class="form-group">
                    <label>Breach Date</label>
                    <input type="date"
                           name="breach_date"
                           required>
                </div>

                <button type="submit" class="btn">
                    <i class="fas fa-save"></i>
                    Save Credential Data
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
