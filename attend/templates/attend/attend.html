<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attend Quiz</title>

    <style>

        body{
            font-family: Arial;
            margin-top: 50px;
        }

        .quiz-box{
            width: 500px;
            border: 2px solid black;
            padding: 20px;
            margin: auto;
        }

        table{
            width: 100%;
        }

        td{
            padding: 10px;
        }

        .question{
            font-weight: bold;
            font-size: 18px;
        }

        input[type="submit"]{
            padding: 5px 15px;
        }

    </style>

</head>

<body>

<div class="quiz-box">

    <center>
        <h2>Attend Quiz & View Score</h2>
    </center>

    <form method="post">

        {% csrf_token %}

        <table>

            <tr>

                <td class="question">Question</td>

                <td class="question">
                    What is the capital of France?
                </td>

            </tr>

            <tr>

                <td>Option 1</td>

                <td>
                    <input type="radio" name="answer" value="Berlin">
                    Berlin
                </td>

            </tr>

            <tr>

                <td>Option 2</td>

                <td>
                    <input type="radio" name="answer" value="Madrid">
                    Madrid
                </td>

            </tr>

            <tr>

                <td>Option 3</td>

                <td>
                    <input type="radio" name="answer" value="Paris">
                    Paris
                </td>

            </tr>

            <tr>

                <td>Option 4</td>

                <td>
                    <input type="radio" name="answer" value="Rome">
                    Rome
                </td>

            </tr>

            <tr>

                <td></td>

                <td>
                    <input type="submit" value="Submit">
                </td>

            </tr>

        </table>

    </form>

</div>

</body>
</html>
